name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine default branches
        run: |
          UPSTREAM_DEFAULT=$(curl -sf https://api.github.com/repos/mstorsjo/llvm-mingw | jq -r .default_branch)
          ORIGIN_DEFAULT=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }} | jq -r .default_branch)
          echo "UPSTREAM_DEFAULT=$UPSTREAM_DEFAULT" >> "$GITHUB_ENV"
          echo "ORIGIN_DEFAULT=$ORIGIN_DEFAULT" >> "$GITHUB_ENV"
          echo "Upstream default: $UPSTREAM_DEFAULT, Origin default: $ORIGIN_DEFAULT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGIN_DEFAULT }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mstorsjo/llvm-mingw.git
          git fetch upstream "$UPSTREAM_DEFAULT"

      - name: Create or update tracking branch
        run: |
          git fetch origin tracking || true
          if git rev-parse --verify origin/tracking >/dev/null 2>&1; then
            git checkout tracking
          else
            git checkout -b tracking
          fi

      - name: Merge default branch into tracking
        run: git merge --no-edit "origin/$ORIGIN_DEFAULT"

      - name: Merge upstream into tracking
        id: clean_merge
        continue-on-error: true
        run: git merge --no-edit "upstream/$UPSTREAM_DEFAULT"

      - name: Fallback merge with -X ours
        if: steps.clean_merge.outcome == 'failure'
        run: |
          git merge --abort
          git merge --no-edit -X ours "upstream/$UPSTREAM_DEFAULT"

      - name: Create issue for resolved conflicts
        if: steps.clean_merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGE_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse "upstream/$UPSTREAM_DEFAULT")
          gh label create "upstream-sync" --color "D93F0B" --description "Auto-resolved upstream merge conflicts" 2>/dev/null || true
          gh issue create \
            --title "Upstream sync: merge conflicts auto-resolved with -X ours" \
            --label "upstream-sync" \
            --body "$(cat <<EOF
          The daily upstream sync from \`mstorsjo/llvm-mingw\` (\`$UPSTREAM_DEFAULT\`) had merge conflicts
          that were auto-resolved by preferring our side (\`-X ours\`).

          - Upstream commit: $UPSTREAM_SHA
          - Resulting merge commit: $MERGE_SHA
          - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please review the merge to ensure no important upstream changes were silently dropped.
          EOF
          )"

      - name: Push tracking
        run: git push origin tracking
