name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Determine default branches
        run: |
          UPSTREAM_DEFAULT=$(curl -sf https://api.github.com/repos/mstorsjo/llvm-mingw | jq -r .default_branch)
          ORIGIN_DEFAULT=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }} | jq -r .default_branch)
          echo "UPSTREAM_DEFAULT=$UPSTREAM_DEFAULT" >> "$GITHUB_ENV"
          echo "ORIGIN_DEFAULT=$ORIGIN_DEFAULT" >> "$GITHUB_ENV"
          echo "Upstream default: $UPSTREAM_DEFAULT, Origin default: $ORIGIN_DEFAULT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ORIGIN_DEFAULT }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mstorsjo/llvm-mingw.git
          git fetch upstream "$UPSTREAM_DEFAULT"

      - name: Create or update tracking branch
        run: |
          git fetch origin tracking || true
          if git rev-parse --verify origin/tracking >/dev/null 2>&1; then
            git checkout tracking
          else
            git checkout -b tracking
          fi

      - name: Merge default branch into tracking
        run: git merge --no-edit "origin/$ORIGIN_DEFAULT"

      - name: Merge upstream into tracking
        id: clean_merge
        continue-on-error: true
        run: git merge --no-edit "upstream/$UPSTREAM_DEFAULT"

      - name: Capture merge conflicts
        if: steps.clean_merge.outcome == 'failure'
        run: |
          git diff --diff-filter=U > /tmp/conflicts.diff
          git merge --abort

      - name: Fallback merge with -X ours
        if: steps.clean_merge.outcome == 'failure'
        run: git merge --no-edit -X ours "upstream/$UPSTREAM_DEFAULT"

      - name: Create issue for resolved conflicts
        if: steps.clean_merge.outcome == 'failure'
        run: |
          MERGE_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse "upstream/$UPSTREAM_DEFAULT")
          CONFLICTS=$(cat /tmp/conflicts.diff)
          jq -n \
            --arg title "Upstream sync: merge conflicts auto-resolved with -X ours ($UPSTREAM_SHA)" \
            --arg conflicts "$CONFLICTS" \
            --arg upstream "$UPSTREAM_SHA" \
            --arg merge "$MERGE_SHA" \
            '{
              title: $title,
              body: ("Auto-resolved merge conflicts when syncing upstream `mstorsjo/llvm-mingw` commit " + $upstream + " into tracking (merge commit " + $merge + ").\n\nOur side (`-X ours`) was preferred. Review these conflicts to ensure nothing important was dropped.\n\n<pre>\n" + $conflicts + "\n</pre>")
            }' | curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d @-

      - name: Push tracking
        run: git push origin tracking
